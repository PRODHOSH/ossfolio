name: Auto-label new ELUSOC

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  label:
    name: Add elusoc label
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Add label
        uses: actions/github-script@v7
        with:
          script: |
            const labelName = 'elusoc';

            if (context.eventName === 'issues') {
              const { owner, repo } = context.repo;
              const issue_number = context.payload.issue.number;

              // Only label non-bot users (keeps CI-generated issues clean)
              const isBot = context.payload.issue.user?.type === 'Bot';
              if (isBot) return;

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [labelName],
              });

              core.info(`Labeled issue #${issue_number} with '${labelName}'.`);
              return;
            }

            if (context.eventName === 'pull_request') {
              const { owner, repo } = context.repo;
              const pull_number = context.payload.pull_request.number;

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: [labelName],
              });

              core.info(`Labeled PR #${pull_number} with '${labelName}'.`);
              return;
            }

