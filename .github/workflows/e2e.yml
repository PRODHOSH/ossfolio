name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Only Chromium. Installing all three engines roughly triples the download for
      # coverage this suite doesn't currently use.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build Next.js application for E2E
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'e2e-anon-key'
          SUPABASE_SERVICE_ROLE_KEY: 'e2e-service-role-key'
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'

      # No secrets are referenced anywhere in this job, and that is deliberate: GitHub does
      # not expose secrets to pull requests from forks, so a suite that needed them would
      # fail for every outside contributor. The database is stood in for by
      # e2e/mock-supabase.mjs, which Playwright starts via `webServer`.
      #
      # NOTE: Runtime environment variables for the Next.js server in CI are configured inside
      # `playwright.config.ts` under `webServer[1].env`. If you add a new server-side env var
      # used at request time, configure it there rather than in this workflow file.
      - name: Run E2E tests
        run: npx playwright test
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
