name: PR Merged Thanks

on:
  pull_request:
    types: [closed]
    branches: [main, develop]

jobs:
  thanks:
    name: Thank contributor
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      pull-requests: write

    steps:
      - name: Post thank you comment
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: `🎉 Your PR just got merged, @${author} — thank you for contributing to OSSfolio!

            Your work is now part of the project. Here's what to do next:
            - ⭐ If you haven't already, consider giving the repo a star — it helps us grow.
            - 📢 Share your contribution on LinkedIn, Twitter, or wherever you hang out. You shipped open source!
            - 🔍 Browse other [open issues](../issues?q=is%3Aissue+is%3Aopen+label%3A%22good+first+issue%22) if you want to keep contributing.

            We really appreciate you taking the time. See you in the next PR! 🚀`
            });
