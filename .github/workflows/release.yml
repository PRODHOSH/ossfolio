name: Release Workflow

on:
  push:
    tags:
      - 'v*' # Trigger only when a version tag is pushed (e.g., v1.0.0)

# Principle of Least Privilege: Default token has NO permissions.
permissions: {}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Explicitly define read-only access for this job
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linters
        run: npm run lint

      - name: Run Type Check
        run: npm run type-check

      - name: Run Unit Tests
        run: npm run test

      - name: Build Application
        run: npm run build

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-test
    # This is the ONLY job that requires write access
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Release Notes & Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
