name: Seed Real Issues Found in Codebase

on:
  workflow_dispatch:

jobs:
  create-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}

    steps:
      - name: Ensure labels exist
        run: |
          gh label create "ADVENTURER"     --color "fb8f44" --description "Intermediate 25 pts" --force --repo "$REPO" || true
          gh label create "VETERAN"        --color "d73a4a" --description "Advanced 50 pts" --force --repo "$REPO" || true
          gh label create "ELUSOC"         --color "7B2FBE" --description "ELUSOC project submission" --force --repo "$REPO" || true
          gh label create "enhancement"    --color "a2eeef" --description "New feature or improvement" --force --repo "$REPO" || true
          gh label create "bug"            --color "d73a4a" --description "Something is not working" --force --repo "$REPO" || true
          gh label create "frontend"       --color "1D76DB" --description "Related to UI / Next.js" --force --repo "$REPO" || true
          gh label create "backend"        --color "5319E7" --description "API / Database / Server" --force --repo "$REPO" || true
          gh label create "github-actions" --color "000000" --description "CI/CD and Workflows" --force --repo "$REPO" || true
          gh label create "documentation"  --color "0075ca" --description "Additions to docs" --force --repo "$REPO" || true
          gh label create "testing"        --color "0e8a16" --description "Unit, E2E, and integration tests" --force --repo "$REPO" || true
          gh label create "performance"    --color "c2e0c6" --description "Speed, memory, and build optimizations" --force --repo "$REPO" || true

      # -----------------------------------------------------------------------
      # SECTION 1 - FAILING UNIT TESTS (confirmed by running npm test locally)
      # -----------------------------------------------------------------------

      - name: "Issue 1 - hashVisitorIp test calls async function without await"
        continue-on-error: true
        run: |
          cat > /tmp/body.md << 'ENDBODY'
          ## Describe the Bug

          The test in `src/lib/__tests__/analytics-tracker.test.ts` for `hashVisitorIp` is failing right now. The function `hashVisitorIp` in `src/lib/analytics-tracker.ts` is async and returns a `Promise<string>` because it uses `crypto.subtle.digest` internally. But the test calls it without `await`, so the assertions end up comparing two different unresolved Promise objects instead of actual string values. This causes a confusing Object.is equality error even though the hashing logic itself is fine.

          ## Steps to Reproduce

          1. Run `npm test` at the project root.
          2. Look at the failure in `analytics-tracker.test.ts`.
          3. The test at line 78 does `expect(hash1).toBe(hash2)` but both `hash1` and `hash2` are unresolved Promises, not strings.

          ## Expected Behavior

          The test should `await` each call to `hashVisitorIp` before asserting on the result. Once fixed, hash1 and hash2 should be the same `ip_...` prefixed string, and hash3 should be different.

          ## Actual Behavior

          The test fails every time because two different Promise objects are never the same reference, even if they would resolve to identical string values.

          ## Files to Change

          - `src/lib/__tests__/analytics-tracker.test.ts` - add `await` to the three `hashVisitorIp` calls in the failing test and mark the test callback `async`.

          ## Additional Context

          The logic in `analytics-tracker.ts` is correct and does not need changing. Only the test needs updating. Good starting point for anyone learning async testing patterns in Vitest.
          ENDBODY
          gh issue create --repo "$REPO" \
            --title "[BUG] analytics-tracker test fails because hashVisitorIp is async but test calls it without await" \
            --label "ADVENTURER,ELUSOC,bug,testing" \
            --body-file /tmp/body.md

      - name: "Issue 2 - buildExploreQuery leaks page param into filter links"
        continue-on-error: true
        run: |
          cat > /tmp/body.md << 'ENDBODY'
          ## Describe the Bug

          In `src/lib/explore-filters.ts`, the `buildExploreQuery` function is supposed to always strip the `page` parameter when building filter navigation links. Clicking any filter should always reset the reader back to page 1. But there is a logic bug: when `page` is part of the existing filter state and no patch is applied, the function still writes `page` into the output object. The test at line 200 of `src/lib/__tests__/explore-filters.test.ts` catches this and fails.

          ## Steps to Reproduce

          1. Run `npm test` and look at the `explore-filters.test.ts` failure.
          2. The test calls `buildExploreQuery(filters({ lang: "Go", page: 3 }))` and asserts the result does not have a `page` key.
          3. The current condition `if (!filterChanged && merged.page > 1) params.set("page", ...)` adds `page` to the output whenever no patch was given and page is above 1.

          ## Expected Behavior

          `buildExploreQuery` should never include `page` in the object it returns. Pagination is always handled separately by the pagination component. Filter links should always start from page 1.

          ## Actual Behavior

          When `page` is in the current filter state and no patch changes another filter, the function includes `page` in the returned query object.

          ## Files to Change

          - `src/lib/explore-filters.ts` - Remove the `page` forwarding block from `buildExploreQuery`. The function should simply never call `params.set("page", ...)`.

          ## Additional Context

          Look at lines 100-109 in `explore-filters.ts` for the block to remove. The fix is very small. Check the test file to see the full expected behavior before touching anything.
          ENDBODY
          gh issue create --repo "$REPO" \
            --title "[BUG] buildExploreQuery incorrectly includes page param in filter links, breaking pagination reset" \
            --label "ADVENTURER,ELUSOC,bug,frontend" \
            --body-file /tmp/body.md

      - name: "Issue 3 - describeFilters uses the wrong Unicode separator character"
        continue-on-error: true
        run: |
          cat > /tmp/body.md << 'ENDBODY'
          ## Describe the Bug

          In `src/lib/explore-filters.ts`, the `describeFilters` function joins active filter labels with the bullet character (U+2022, looks like a filled circle). But the test in `src/lib/__tests__/explore-filters.test.ts` expects the middle dot (U+00B7, a smaller centered dot). These two characters look nearly identical at small font sizes but are completely different Unicode code points, so a strict equality check fails every time.

          ## Steps to Reproduce

          1. Run `npm test`.
          2. Find the failure message showing the difference between the bullet and middle dot characters.
          3. Open `src/lib/explore-filters.ts` and look for the `.join()` call near the bottom of `describeFilters`.

          ## Expected Behavior

          The separator should be the middle dot U+00B7, which matches what the test expects and is the standard character used for breadcrumb-style labels in the design system (see DESIGN.md).

          ## Actual Behavior

          The implementation uses U+2022 bullet but the test expects U+00B7 middle dot. They do not match.

          ## Files to Change

          - `src/lib/explore-filters.ts` - In the `describeFilters` function, change the join separator from the bullet character to the middle dot character. Make sure you paste the actual U+00B7 character and not a hyphen or different symbol.

          ## Additional Context

          This is a one-character fix. Before committing, do a quick visual check in the UI to confirm the separator looks right above the leaderboard results.
          ENDBODY
          gh issue create --repo "$REPO" \
            --title "[BUG] describeFilters uses wrong Unicode separator causing test failure" \
            --label "ADVENTURER,ELUSOC,bug,frontend,testing" \
            --body-file /tmp/body.md

      - name: "Issue 4 - CSV export quotes all values but test expects username unquoted"
        continue-on-error: true
        run: |
          cat > /tmp/body.md << 'ENDBODY'
          ## Describe the Bug

          In `src/lib/profile-export.ts`, the `escapeCsv` helper always wraps every value in double quotes, so the username row in a CSV export comes out as `Username,"testuser"`. But the test at `src/lib/__tests__/profile-export.test.ts` checks for `Username,testuser` without quotes, so the test fails.

          ## Steps to Reproduce

          1. Run `npm test`.
          2. Look at the failure in `profile-export.test.ts`.
          3. The test does `expect(content).toContain("Username,testuser")` but the actual content has `Username,"testuser"`.

          ## Expected Behavior

          `escapeCsv` should only add quotes when the value actually needs them: when it contains a comma, double-quote, or newline character. GitHub usernames never contain any of those, so they should not be quoted. This matches RFC 4180 which says quoting is optional when not required.

          ## Actual Behavior

          Every single value gets quoted unconditionally. Technically valid CSV but does not match what the test expects, and adds unnecessary noise for simple values like usernames.

          ## Files to Change

          - `src/lib/profile-export.ts` - Update `escapeCsv` to only wrap in quotes when the value contains a comma, double-quote, or newline.
          - `src/lib/__tests__/profile-export.test.ts` - Verify the assertion matches the new output once the fix is in place.

          ## Additional Context

          The RFC 4180 approach of quoting only when needed is the cleaner option since GitHub usernames are always safe strings with no special characters.
          ENDBODY
          gh issue create --repo "$REPO" \
            --title "[BUG] CSV export always quotes values but test expects unquoted username, causing test failure" \
            --label "ADVENTURER,ELUSOC,bug,testing,backend" \
            --body-file /tmp/body.md

      - name: "Issue 5 - webhook-dead-letter tests fail because mock is missing a chained eq call"
        continue-on-error: true
        run: |
          cat > /tmp/body.md << 'ENDBODY'
          ## Describe the Bug

          Two tests in `src/lib/__tests__/webhook-dead-letter.test.ts` are currently failing. The real `processDeadLetterQueue` function in `src/lib/webhook-dead-letter.ts` chains `.update().eq().eq().select().maybeSingle()` to atomically lock a dead-letter row before processing it. Both `.eq()` calls are needed to match on `id` and also verify that `status` is still `"pending"`. But the test mocks only set up one `.eq()` that resolves immediately. When the real code calls the second `.eq()`, it crashes with a TypeError.

          ## Steps to Reproduce

          1. Run `npm test`.
          2. Find the two failing tests in `webhook-dead-letter.test.ts`.
          3. The error in the log is: `TypeError: adminClient.from(...).update(...).eq(...).eq is not a function`

          ## Expected Behavior

          The mock for `supabaseAdmin` needs to match the full actual call chain. The update path should: first `.eq()` returns an object with a second `.eq()`, which returns an object with `.select()`, which returns an object with `.maybeSingle()`, which finally resolves to `{ data: { id: "item-1" }, error: null }`.

          ## Actual Behavior

          The mock only has one `.eq()` that resolves immediately, so the second chained `.eq()` call throws because the returned object has no `.eq` method on it.

          ## Files to Change

          - `src/lib/__tests__/webhook-dead-letter.test.ts` - Fix the `mockUpdate` chain in both failing tests to match the actual `.eq().eq().select().maybeSingle()` chain used in `processDeadLetterQueue`.

          ## Additional Context

          Look at lines 107-117 in `src/lib/webhook-dead-letter.ts` to see the exact call chain to mock. The pattern is the same in both failing tests so fixing one will show you how to fix the other.
          ENDBODY
          gh issue create --repo "$REPO" \
            --title "[BUG] webhook-dead-letter tests fail because mock Supabase chain is missing a second .eq() call" \
            --label "ADVENTURER,ELUSOC,bug,testing,backend" \
            --body-file /tmp/body.md

      - name: "Issue 6 - v1 users API tests read profile fields off the wrong level of the response"
        continue-on-error: true
        run: |
          cat > /tmp/body.md << 'ENDBODY'
          ## Describe the Bug

          Two tests in `src/lib/__tests__/v1-users-caching.test.ts` are currently failing. The `GET /api/v1/users/[username]` route wraps its JSON response using `createApiResponse`, which outputs `{ success: true, data: { username, score, ... } }`. But both failing tests read the response as if the profile fields are at the top level. One test does `(await res.json()).username` which gets `undefined` because username is actually at `body.data.username`. The other does `expect(body).toEqual({ username: "octocat", ... })` but the body is the full wrapper object.

          ## Steps to Reproduce

          1. Run `npm test`.
          2. Look at the two failures in `v1-users-caching.test.ts`: "a stale ETag falls through to a full 200" and "200 body matches the public contract exactly".
          3. Log `await res.json()` inside the test and you will see `{ success: true, data: { username: "octocat", ... } }`, not `{ username: "octocat", ... }`.

          ## Expected Behavior

          The tests should unwrap `data` before asserting:
          - Use `(await res.json()).data.username` instead of `(await res.json()).username`
          - Use `expect(body.data).toEqual({ username: "octocat", ... })` instead of `expect(body).toEqual(...)`

          ## Actual Behavior

          Both tests access profile fields from the top level of the JSON body, so they get undefined or a shape mismatch and fail.

          ## Files to Change

          - `src/lib/__tests__/v1-users-caching.test.ts` - Update the two failing tests to read from `body.data` instead of `body` directly.

          ## Additional Context

          The other tests in that file (ETag headers, 304 flow, cache headers, CORS) all pass fine because they only check response headers and status codes, not the body shape. Only the two tests that read body fields are broken.
          ENDBODY
          gh issue create --repo "$REPO" \
            --title "[BUG] v1 users API caching tests fail because they read profile fields from the wrong level of the response body" \
            --label "ADVENTURER,ELUSOC,bug,testing,backend" \
            --body-file /tmp/body.md

      # -----------------------------------------------------------------------
      # SECTION 2 - DOCS BUGS (broken links and inaccurate content)
      # -----------------------------------------------------------------------

      - name: "Issue 7 - CONTRIBUTING.md has hardcoded absolute file paths from another dev machine"
        continue-on-error: true
        run: |
          cat > /tmp/body.md << 'ENDBODY'
          ## What Needs Fixing?

          In `CONTRIBUTING.md`, the Auth Flow section contains two clickable file links that are hardcoded to an absolute path on one specific developer's Windows machine. They look like:

          `[AuthModal.tsx](file:///c:/Users/Rushabh%20Mahajan/Documents/GitHub/ossfolio/src/...)`

          These links are broken for everyone except the person who wrote them. Anyone clicking them from GitHub or from their own local clone gets a dead link with no error message, just nothing happens.

          ## Suggested Fix

          Replace the hardcoded `file:///` paths with relative paths that work for everyone reading on GitHub:

          - `[AuthModal.tsx](src/components/auth/AuthModal.tsx)` instead of the absolute path
          - `[auth/callback/page.tsx](src/app/auth/callback/page.tsx)` instead of the absolute path

          ## Location

          `CONTRIBUTING.md`, lines 225 and 228, inside the End-to-End OAuth Lifecycle section under Auth Flow.

          ## Additional Context

          No code changes needed at all. This is a pure docs fix. Good first issue for someone who wants to contribute but is not ready to touch TypeScript yet. Both target files exist at the relative paths shown above.
          ENDBODY
          gh issue create --repo "$REPO" \
            --title "[DOCS] CONTRIBUTING.md has hardcoded local file:// paths that are broken for all contributors" \
            --label "ADVENTURER,ELUSOC,documentation" \
            --body-file /tmp/body.md

      - name: "Issue 8 - README lists shadcn/ui and wrong Node version"
        continue-on-error: true
        run: |
          cat > /tmp/body.md << 'ENDBODY'
          ## What Needs Fixing?

          The README.md tech stack table says the frontend uses shadcn/ui. But `package.json` does not have shadcn/ui as a dependency. The project uses Radix UI primitives directly (`@radix-ui/react-dialog`, `@radix-ui/react-avatar`, `@radix-ui/react-dropdown-menu`, etc.) and Class Variance Authority for variant management. Listing shadcn/ui is inaccurate and misleads contributors who might go looking for the shadcn component library, not find it, and either get confused or install it unnecessarily.

          Separately, the setup section says "Node.js 20+" as a requirement. But both `ci.yml` and `e2e.yml` pin to Node 22. A contributor running Node 20 might hit incompatibilities that CI would catch immediately.

          ## Suggested Fix

          1. In the tech stack table (around line 104), change `shadcn/ui` to `Radix UI + CVA` to match what is actually installed.
          2. In the prerequisites list (around line 115), change "Node.js 20+" to "Node.js 22+" to match what CI runs on.

          ## Location

          `README.md`, tech stack table and local setup prerequisites section.

          ## Additional Context

          Both changes are single-line edits. No code changes needed. Good first issue.
          ENDBODY
          gh issue create --repo "$REPO" \
            --title "[DOCS] README lists shadcn/ui and wrong Node version, both are inaccurate" \
            --label "ADVENTURER,ELUSOC,documentation" \
            --body-file /tmp/body.md

      # -----------------------------------------------------------------------
      # SECTION 3 - CI AND WORKFLOW ISSUES
      # -----------------------------------------------------------------------

      - name: "Issue 9 - E2E workflow runtime env vars for the server are implicit and undocumented"
        continue-on-error: true
        run: |
          cat > /tmp/body.md << 'ENDBODY'
          ## Describe the Bug

          In `.github/workflows/e2e.yml`, the job runs `npm run build` in a dedicated step with the mock Supabase env vars baked in, which is correct because NEXT_PUBLIC values get inlined at build time. Then Playwright starts the server using the `webServer` config in `playwright.config.ts`, which also passes env vars to it. The problem is that this connection between the workflow and the server env vars is invisible. The workflow step says "run Playwright tests" but does not explain that runtime env vars for the Next.js server are configured inside `playwright.config.ts`, not in the workflow file itself.

          Any contributor who adds a new server-side env var and looks at the workflow file to add it will put it in the wrong place. The server will silently get an empty value and the bug will only show up in E2E test output, which is confusing to trace back to a missing env var.

          ## Steps to Reproduce

          1. Add a new route handler that reads a new `process.env.MY_SECRET` at request time.
          2. Add `MY_SECRET` to the workflow build step env block but not to `playwright.config.ts`.
          3. Write an E2E test that hits the route and observe it fail silently in CI while passing locally.

          ## Expected Behavior

          The CI workflow should have a clear comment pointing contributors to `playwright.config.ts` for adding runtime env vars. The `playwright.config.ts` webServer env block should have a comment explaining its role in CI.

          ## Actual Behavior

          There is no documentation of this connection anywhere. The env vars flow is implicit and easy to get wrong.

          ## Files to Change

          - `.github/workflows/e2e.yml` - Add a comment on the Playwright test step pointing to `playwright.config.ts` for runtime env var configuration.
          - `playwright.config.ts` - Add a comment to the `env:` block in `webServer` explaining that this is the place to add runtime env vars for the server in CI.

          ## Additional Context

          Read `playwright.config.ts` lines 44-65 to understand the current setup before making any changes. The fix is documentation only, no code changes.
          ENDBODY
          gh issue create --repo "$REPO" \
            --title "[BUG] E2E workflow runtime env vars for the Next.js server are implicit and easy to get wrong" \
            --label "ADVENTURER,ELUSOC,bug,github-actions,testing" \
            --body-file /tmp/body.md

      # -----------------------------------------------------------------------
      # SECTION 4 - PERFORMANCE AND ARCHITECTURE
      # -----------------------------------------------------------------------

      - name: "Issue 10 - supabaseAdmin creates a new client on every call instead of caching it"
        continue-on-error: true
        run: |
          cat > /tmp/body.md << 'ENDBODY'
          ## Problem Statement

          In `src/lib/supabase.ts`, the `supabaseAdmin()` function creates a brand new Supabase client object every single time it is called. There is no caching at all. In contrast, the `getSupabase()` function for the anon client uses a module-level `_client` variable so the client is only created once and reused on every subsequent call.

          `supabaseAdmin` gets called in hot paths like `processDeadLetterQueue`, route handlers, and webhook processing. Each `createClient` call allocates memory and sets up internal state. In a Cloudflare Workers edge environment, this per-request overhead is unnecessary and inconsistent with how the anon client already works.

          ## Proposed Fix

          Apply the same lazy singleton pattern that `getSupabase()` already uses:

          1. Add a module-level `let _adminClient = null` variable near the top of `supabase.ts`.
          2. Inside `supabaseAdmin()`, check if `_adminClient` is null. If so, create it and cache it. If not, return the cached instance.
          3. Export a `resetSupabaseAdminClientForTesting()` function alongside the existing `resetSupabaseClientForTesting()` so tests can clear the singleton between test cases without leaking state.

          ## Alternatives Considered

          Keeping the current behavior and accepting the per-call overhead. It works but is wasteful and inconsistent with the anon client pattern right next to it.

          ## Files to Change

          - `src/lib/supabase.ts` - Add the `_adminClient` singleton and update `supabaseAdmin()` to use it.
          - `src/lib/__tests__/supabase-lazy.test.ts` - Add a test verifying that two consecutive calls to `supabaseAdmin()` return the exact same object reference.

          ## Additional Context

          Look at how `getSupabase()` uses the `_client` variable and apply the same pattern. No Proxy needed here since `supabaseAdmin` is only ever called server-side and the lazy init on first call is sufficient.
          ENDBODY
          gh issue create --repo "$REPO" \
            --title "[PERF] supabaseAdmin() creates a new Supabase client on every call instead of reusing a cached instance" \
            --label "ADVENTURER,ELUSOC,enhancement,backend,performance" \
            --body-file /tmp/body.md
